          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Portfolio details
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  portfolio:
                    type: object
                    properties:
                      id:
                        type: string
                      name:
                        type: string
                      description:
                        type: string
                      total_value:
                        type: number
                      total_cost:
                        type: number
                      total_gain_loss:
                        type: number
                      gain_loss_percent:
                        type: number
                      created_at:
                        type: string
                        format: date-time

    put:
      summary: Update portfolio
      operationId: updatePortfolio
