    get:
      summary: Check if asset is on watchlist
      operationId: checkWatchlistAsset
      tags:
        - Watchlist
      security:
        - CookieAuth: []
      parameters:
        - name: assetId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Watchlist status
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  on_watchlist:
