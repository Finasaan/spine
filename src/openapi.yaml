          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  portfolios:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        name:
                          type: string
                        total_value:
                          type: number
                        total_cost:
                          type: number
                        total_gain_loss:
                          type: number
                        created_at:
                          type: string
                          format: date-time

    post:
      summary: Create a new portfolio
      operationId: createPortfolio
      tags:
        - Portfolio
      security:
        - CookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
              properties:
                name:
                  type: string
                  example: "My Stock Portfolio"
                description:
                  type: string
      responses:
        '201':
          description: Portfolio created
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  portfolio:
                    type: object
                    properties:
                      id:
                        type: string
                      name:
                        type: string

  /portfolio/{id}:
    get:
      summary: Get portfolio details
