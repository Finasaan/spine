  /portfolio/{id}/summary:
    get:
      summary: Get portfolio summary with allocation
      operationId: getPortfolioSummary
      tags:
        - Portfolio
      security:
        - CookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Portfolio summary with metrics
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  summary:
                    type: object
                    properties:
                      portfolio_id:
                        type: string
                      total_value:
                        type: number
                      total_invested:
                        type: number
                      total_gain_loss:
                        type: number
                      gain_loss_percent:
                        type: number
                      daily_change:
                        type: number
                      daily_change_percent:
                        type: number
                      allocation:
                        type: object
                        properties:
                          stocks:
                            type: number
                          funds:
                            type: number
                          cash:
                            type: number
                      top_holding:
                        type: object
                        properties:
                          symbol:
                            type: string
                          value:
                            type: number
                          percent:
                            type: number

  /portfolio/{id}/holdings:
    post:
      summary: Add holding to portfolio
      operationId: addHolding
      tags:
        - Portfolio
      security:
        - CookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - asset_id
                - asset_type
                - quantity
                - purchase_price
              properties:
                asset_id:
                  type: string
                asset_type:
                  type: string
                  enum: [stock, fund]
                quantity:
                  type: number
                purchase_price:
                  type: number
                purchase_date:
                  type: string
                  format: date
      responses:
        '201':
          description: Holding added
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  holding:
                    type: object
                    properties:
                      id:
                        type: string
                      symbol:
                        type: string
                      quantity:
                        type: number
                      purchase_price:
                        type: number
                      current_value:
                        type: number
                      gain_loss:
                        type: number

  /portfolio/{id}/holdings/{holdingId}:
    put:
      summary: Update holding
      operationId: updateHolding
      tags:
        - Portfolio
      security:
        - CookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: holdingId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                quantity:
                  type: number
                purchase_price:
                  type: number
      responses:
        '200':
          description: Holding updated

    delete:
      summary: Remove holding from portfolio
      operationId: deleteHolding
      tags:
        - Portfolio
      security:
        - CookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: holdingId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Holding removed

components:
  securitySchemes:
    CookieAuth:
      type: apiKey
      in: cookie
      name: sb-token
      description: Supabase JWT token in HttpOnly cookie (automatically included in browser requests)
